name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # The core and the chat layer do not depend on Godot; CI runs without installing
    # the engine. This workflow being able to run engine-free is the live test of the
    # architecture rule (see CLAUDE.md -> "Architecture rule"). If a Godot reference
    # leaks in, this breaks.
    name: Core build + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Domina.slnx

      - name: Build
        run: dotnet build Domina.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Domina.slnx --no-build --configuration Release --verbosity normal

      - name: Format check
        run: dotnet format Domina.slnx --verify-no-changes --severity warn

  game:
    # The Godot layer is a SEPARATE job. Adding it to the same job would pollute the
    # test that proves the core builds engine-free; kept this way, the "core" job still
    # runs without touching Godot at all (see CLAUDE.md -> "Architecture rule").
    #
    # Why it is needed: src/Game is not part of the solution (Domina.slnx), so when a
    # signature change in the core breaks this layer the "core" job stays green and the
    # error stays invisible until Godot is opened next.
    #
    # The engine binary is not downloaded: Godot.NET.Sdk is a NuGet package, no editor is
    # needed to build. That is why this job takes about a minute.
    name: Godot layer build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/Game/Domina.Game.csproj

      - name: Build
        run: dotnet build src/Game/Domina.Game.csproj --no-restore --configuration Release
